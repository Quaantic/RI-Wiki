  <!-- Tema aplicado antes do CSS para nao piscar (padrao: dark) -->
  <script>
    try {
      var t = localStorage.getItem('ri-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      if (localStorage.getItem('ri-motion') === '1') document.documentElement.classList.add('reduce-motion');
      if (localStorage.getItem('ri-res-colors') === '0') document.documentElement.classList.add('res-off');
      if (localStorage.getItem('ri-textures') === '0') document.documentElement.classList.add('tex-off');
    } catch (e) {}
  </script>
