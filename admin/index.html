<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#171b18">
  <title>Wiki Studio | RI Wiki</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="./admin.css">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
  <main id="app" class="studio">
    <header class="topbar">
      <a class="brand" href="../" aria-label="RI Wiki home">
        <span class="brand-mark">RI</span>
        <span><strong>RI Wiki</strong><small>CONTENT STUDIO</small></span>
      </a>
      <div class="topbar__status" id="status" role="status">Connecting to GitHub…</div>
      <div class="topbar__search">
        <label class="search-label" for="studio-search" hidden>Search</label>
        <input class="search-input" id="studio-search" type="search" placeholder="Search pages, items, releases…" aria-label="Search" hidden>
        <button class="icon-button" id="toggle-search" type="button" title="Search">🔍</button>
      </div>
      <div class="topbar__actions">
        <button id="save" class="button button--primary" type="button">Save changes</button>
      </div>
    </header>

    <div id="workspace" class="workspace">
      <aside class="sidebar">
        <div class="sidebar__heading">WORKSPACE</div>
        <nav class="tabs" aria-label="Content sections">
          <button class="tab is-active" data-screen="wiki" type="button"><span>◇</span> Wiki pages</button>
          <button class="tab" data-screen="game" type="button"><span>⚙</span> Game data</button>
          <button class="tab" data-screen="updates" type="button"><span>◷</span> Update log</button>
          <button class="tab" data-screen="versions" type="button"><span>↶</span> Versions</button>
        </nav>
        <div class="sidebar__heading sidebar__heading--tree"><span id="tree-heading">WIKI STRUCTURE</span><div class="sidebar__tree-actions"><button id="toggle-tree" class="tree-toggle" type="button">Collapse all</button><button id="add-category" class="icon-button" aria-label="Add category" title="Add category" type="button">+</button></div></div>
        <div id="tree" class="tree"></div>
        <div class="sidebar__footer">
          <span class="connection-dot"></span>
          <span>Connected to <b>Quaantic/RI-Wiki</b></span>
        </div>
      </aside>

      <section class="editor">
        <div id="screen-content" class="screen-content"></div>
      </section>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
